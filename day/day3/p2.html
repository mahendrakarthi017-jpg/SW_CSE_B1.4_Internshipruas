<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>html table : span column/row</title>
</head>
<body>
    <table border="1">
        <tr>
            <th colspan="3"> 
                STUDENT DETAILS
            </th>
        </tr>
        <tr>

            <td>karthik</td>
        </tr>
        <tr>
            <td>couse</td>
            <td>cse</td>
            <td>ise</td>
        </tr>
    </table>
    
</body>
</html>
