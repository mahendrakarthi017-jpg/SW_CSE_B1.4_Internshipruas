<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>html table : span column/row</title>
</head>

<body>
    <table border="1">
        <tr>
            <th colspan="3">
                STUDENT DETAILS
            </th>
        </tr>
        <tr>
            <td>name</td>
            <td>mahendra</td>
            <td>karthik</td>
        </tr>
        <tr>
            <td>couse</td>
            <td>cse</td>
            <td>ise</td>
        </tr>
    </table>

    <p>row span</p>
    <table border="1">
        <tr>
            <th rowspan="2">day</th>
            <th>moring</th>
            <th>night</th>
        </tr>
        <tr>
            <td>preparation</td>
            <td>time pass</td>

        </tr>
    </table>

</body>

</html>
