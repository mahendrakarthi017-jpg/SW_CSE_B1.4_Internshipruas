<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video tag</title>
</head>

<body>
    <p>VIDEO TAG</p>
    <video src="sample-5s-360p.mp4" controls>
        your browser doesn't support video tag
    </video>

    <video src="sample-5s-360p.webm"> your browser doesn't support video tag</video>

    </video>
    <!-- width and height -->

    <video src="sample-5s-360p.mp4" width="1020" height="510" controls> your browser doesn't support video tag</video>

    <!-- auto play -->
    <video src="sample-5s-360p.mp4" width="1020" height="510" autoplay controls>
        your browser doesn't support video tag
    </video>
    <!--muted -->
    <video src="sample-5s-360p.mp4" width="1020" height="510" autoplay muted controls>
        your browser doesn't support video tag
    </video>
    <!-- loop -->
    <video src="sample-5s-360p.mp4" width="1020" height="510" loop autoplay muted controls>
        your browser doesn't support video tag
    </video>

    <!-- poster -->
    <video src="sample-5s-360p.mp4" width="1020" height="510" poster="download.jpeg" autoplay muted controls>
        your browser doesn't support video tag
    </video>

    <!-- preload -->
    <video src="sample-5s-360p.mp4" width="1020" height="510" poster="download.jpeg" preload="none" muted controls>
        your browser doesn't support video tag
    </video>



</body>

</html>
